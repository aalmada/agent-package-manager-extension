name: Validate extension
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      APM_CI_VERSION: '0.35.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the verified APM CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64)
              archive=apm-linux-x86_64.tar.gz
              checksum=5aa23ce61eebae9411668f507772cdb5d87252c760078dc59b5acdc5188d785b ;;
            Linux/ARM64)
              archive=apm-linux-arm64.tar.gz
              checksum=ada8901ce1b29e5d188629eeed64e8499853a8cb5f047630ebedbde24008508e ;;
            macOS/X64)
              archive=apm-darwin-x86_64.tar.gz
              checksum=ee17daf433c49ed481d9f2ddee31825cbced9390637cab9a5138815bbace327c ;;
            macOS/ARM64)
              archive=apm-darwin-arm64.tar.gz
              checksum=cb2c54152e3bd39acfe2fbda4a2aa91d2af914e24859d3623423efd7b27e3dd0 ;;
            Windows/X64|Windows/ARM64)
              archive=apm-windows-x86_64.zip
              checksum=9a0a912b3ba68ac154b940e1931425c85f03edcfcc2339661d3aa32d8fa17c2f ;;
            *)
              echo "::error::Unsupported runner: $RUNNER_OS/$RUNNER_ARCH"
              exit 1 ;;
          esac
          temp="$RUNNER_TEMP"
          if [ "$RUNNER_OS" = Windows ]; then temp=$(cygpath -u "$temp"); fi
          destination="$temp/apm-baseline"
          mkdir -p "$destination"
          gh release download "v$APM_CI_VERSION" --repo microsoft/apm --pattern "$archive" --dir "$destination"
          archive_path="$destination/$archive"
          actual=$(node -e "const fs=require('node:fs'),crypto=require('node:crypto');process.stdout.write(crypto.createHash('sha256').update(fs.readFileSync(process.argv[1])).digest('hex'))" "$archive_path")
          if [ "$actual" != "$checksum" ]; then
            echo "::error::APM archive checksum mismatch."
            exit 1
          fi
          if [ "$RUNNER_OS" = Windows ]; then
            python -m zipfile -e "$archive_path" "$destination"
            executable="$destination/apm-windows-x86_64/apm.exe"
          else
            tar -xzf "$archive_path" -C "$destination"
            executable="$destination/${archive%.tar.gz}/apm"
          fi
          "$executable" --version
          if [ "$RUNNER_OS" = Windows ]; then executable=$(cygpath -w "$executable"); fi
          printf 'APM_TEST_EXECUTABLE=%s\n' "$executable" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:extension
      - if: runner.os != 'Linux'
        run: npm run test:extension
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: apm-${{ matrix.os }}
          path: "*.vsix"
