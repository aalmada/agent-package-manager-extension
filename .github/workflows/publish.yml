name: Publish to VS Code Marketplace
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marketplace-publish
  cancel-in-progress: false
jobs:
  validate-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Require the default branch
        env:
          WORKFLOW_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$WORKFLOW_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Run this workflow from the repository's default branch."
            exit 1
          fi
  validate:
    needs: validate-ref
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apm-ubuntu-latest
          path: release
      - name: Publish the validated VSIX
        shell: bash
        run: |
          shopt -s nullglob
          packages=(release/*.vsix)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one VSIX from the Linux validation job."
            exit 1
          fi
          npx vsce publish --oidc --packagePath "${packages[0]}"
